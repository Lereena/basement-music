name: basement_music
description: Music player with the ability to download tracks from YouTube

publish_to: "none"

version: 1.1.0+8

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  another_flushbar: ^2.2.4
  audio_service: ^0.18.12
  audioplayers: ^6.6.0
  auto_size_text: ^3.0.0
  bloc: ^9.2.1
  collection: ^1.17.2
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.2
  dio: ^5.3.3
  dotted_border: ^3.1.0
  equatable: ^2.0.3
  freezed_annotation: ^3.1.0
  file_picker: ^11.0.2
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_crashlytics: ^5.2.2
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_dropzone: ^4.2.1
  flutter_search_bar: ^3.0.0-dev.1
  go_router: ^17.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  http_parser: ^4.0.0
  json_annotation: ^4.12.0
  lint: ^2.1.2
  logger: ^2.0.2
  marquee_text: ^2.5.0+1
  meta: ^1.9.1
  path_provider: ^2.1.1
  pretty_dio_logger: ^1.3.1
  retrofit: ^4.9.2
  rxdart: ^0.28.0
  sizer: ^3.1.3
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.4.6
  freezed: ^3.2.5
  flutter_native_splash: ^2.2.14
  flutter_test:
    sdk: flutter
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.6
  flutter_lints: ^6.0.0

# win32 5.0.x references UnmodifiableUint8ListView, which is not in Dart 3.11's
# dart:typed_data (use Uint8List.asUnmodifiableView() instead). A transitive
# dependency pins an incompatible 5.0.8; override to a release that matches the SDK.
dependency_overrides:
  win32: ^5.10.0

flutter:
  assets:
    - assets/
    - shorebird.yaml
  uses-material-design: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/audio-waves.png

  color_dark: "#000000"
  image_dark: assets/audio-waves-colored.png

  android_12:
